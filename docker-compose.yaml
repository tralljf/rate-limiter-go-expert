services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build:
      context: .
    env_file: .env
    environment:
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  test:
    build:
      context: .
      target: test
    environment:
      REDIS_TEST_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["test"]
